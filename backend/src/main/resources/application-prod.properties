# ============================================================
# RESERVO BACKEND - PRODUCTION PROFILE (application-prod.properties)
# ============================================================

spring.application.name=reservo-backend-production

# Strict Error Sanitization - Never leak stack traces or internal server details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Database Seeding: ALWAYS DISABLED BY DEFAULT IN PRODUCTION
app.database.seed.enabled=${DB_SEED_ENABLED:false}

# Testing Mode: Strictly Disabled
app.testing.mode=false

# DevTools: Disabled
spring.devtools.restart.enabled=false

# Actuator Health Checks in Production: Expose only health & info, hide internal system structure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Production Logging Levels
logging.level.root=INFO
logging.level.com.reservo.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.com.google.cloud.firestore=INFO

# ============================================================
# HTTP RESPONSE COMPRESSION (GZIP)
# ============================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ============================================================
# RAZORPAY CONFIGURATION (Production Environment Variables)
# ============================================================
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
