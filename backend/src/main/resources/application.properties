spring.application.name=reservo-backend

# Firebase handles authentication in this project. Disable Spring Security's
# separate OAuth2-client auto-configuration unless/ until backend OAuth login is
# deliberately introduced with complete provider credentials.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration


# ============================================================
# JWT CONFIGURATION
# ============================================================

app.jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}


# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://192.168.31.170:5174,http://192.168.31.170:5173,https://four-coins-occur.loca.lt}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google Places API (New) is called only by the backend. Keep this key in server environment variables.
app.google.places.api-key=${GOOGLE_PLACES_API_KEY:}

# Per-client/IP token bucket for /api/v1/places/**. Capacity refills fully every minute.
app.rate-limit.places.requests-per-minute=${PLACES_RATE_LIMIT_PER_MINUTE:20}


# ============================================================
# OTP
# ============================================================

app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}


# ============================================================
# FIREBASE
# ============================================================

firebase.service.account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}


# ============================================================
# TESTING MODE
# ============================================================

app.testing.mode=${TESTING_MODE:false}


# ============================================================
# GOOGLE
# ============================================================

# Google OAuth sign-in is optional. Do not define empty Spring OAuth2
# registrations: Spring validates them at startup and fails if the client ID is blank.
# When Google sign-in is needed, configure these only with real credentials through
# deployment environment variables, not source-controlled properties.
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=...
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=...
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=openid,profile,email


# ============================================================
# FACEBOOK
# ============================================================

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:setup-facebook-client-id-in-env}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:setup-facebook-client-secret-in-env}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile


# ============================================================
# TWITTER / X
# ============================================================

spring.security.oauth2.client.registration.twitter.client-id=${TWITTER_CLIENT_ID:setup-twitter-client-id-in-env}
spring.security.oauth2.client.registration.twitter.client-secret=${TWITTER_CLIENT_SECRET:setup-twitter-client-secret-in-env}
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.twitter.scope=users.read,tweet.read

spring.security.oauth2.client.provider.twitter.authorization-uri=https://twitter.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.twitter.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.twitter.com/2/users/me
spring.security.oauth2.client.provider.twitter.user-name-attribute=id


# ============================================================
# EMAIL / SMTP
# ============================================================

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ============================================================
# STRIPE
# ============================================================

app.stripe.api-key=${STRIPE_API_KEY:sk_test_51PxSampleKey}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_SampleSecret}


# ============================================================
# DATABASE SEEDING
# ============================================================

app.database.seed.enabled=${DB_SEED_ENABLED:true}


# ============================================================
# MEDIA STORAGE
# ============================================================

app.media.storage-dir=${MEDIA_STORAGE_DIR:uploads/media}


# ============================================================
# FILE UPLOAD LIMITS
# ============================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
# Prevent classloader restart issues during local development
spring.devtools.restart.enabled=false


# ============================================================
# ACTUATOR HEALTH CHECKS & METRICS
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
