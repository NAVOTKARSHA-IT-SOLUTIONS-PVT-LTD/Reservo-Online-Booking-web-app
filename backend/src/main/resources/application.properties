spring.application.name=reservo-backend

# H2 In-Memory Database for zero-setup execution fallback
spring.datasource.url=jdbc:h2:mem:reservodb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console configuration for testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e7b1a5c6d8e2f0a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OTP Configuration
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}

# OAuth Configuration (for future Google/Apple OAuth)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.apple.client-id=${APPLE_CLIENT_ID:}
spring.security.oauth2.client.registration.apple.client-secret=${APPLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.apple.scope=openid,profile,email
