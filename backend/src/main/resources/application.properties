spring.application.name=reservo-backend

# Database Configuration (Use H2 for development)
spring.datasource.url=jdbc:h2:mem:reservodb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=reservo_secure_h2_pass
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console configuration for testing (DISABLED IN PRODUCTION)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration (WARNING: Use strong random secret in production)
app.jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (comma-separated for production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://192.168.31.170:5174,http://192.168.31.170:5173,https://four-coins-occur.loca.lt}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# OTP Configuration
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}

# Firebase Configuration for Phone Authentication
firebase.service.account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Testing Mode Configuration (set to true for development/testing without Firebase billing)
app.testing.mode=${TESTING_MODE:false}

# OAuth Configuration (ENABLED)
spring.security.oauth2.client.enabled=true

# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:setup-facebook-client-id-in-env}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:setup-facebook-client-secret-in-env}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Twitter
spring.security.oauth2.client.registration.twitter.client-id=${TWITTER_CLIENT_ID:setup-twitter-client-id-in-env}
spring.security.oauth2.client.registration.twitter.client-secret=${TWITTER_CLIENT_SECRET:setup-twitter-client-secret-in-env}
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.twitter.scope=users.read,tweet.read
spring.security.oauth2.client.provider.twitter.authorization-uri=https://twitter.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.twitter.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.twitter.com/2/users/me
spring.security.oauth2.client.provider.twitter.user-name-attribute=id

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Stripe Configuration API keys
app.stripe.api-key=${STRIPE_API_KEY:sk_test_51PxSampleKey}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_SampleSecret}